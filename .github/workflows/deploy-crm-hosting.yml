name: Deploy CRM to Firebase Hosting

on:
  pull_request:
    types: [closed]
    branches:
      - master
    paths:
      - 'apps/CRM/**'
      - 'apps/firebase/firebase.json'
      - '.github/workflows/deploy-crm-hosting.yml'

jobs:
  build_and_deploy:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build CRM
        run: cd apps/CRM && pnpm run deploy
        env:
          NEXT_PUBLIC_FIREBASE_API_KEY: AIzaSyDogjn3RauIxH19tqldSxu_dAuX0U97P44
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: abtec-8f31e.firebaseapp.com
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: abtec-8f31e
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: abtec-8f31e.firebasestorage.app
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: 453551453612
          NEXT_PUBLIC_FIREBASE_APP_ID: 1:453551453612:web:93f83eff2f9e279f177609
          NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID: G-B7PNVX0KKF

      - name: Deploy to Firebase Hosting
        uses: w9jds/firebase-action@master
        with:
          args: deploy --only hosting --project abtec-8f31e --config apps/firebase/firebase.json
        env:
          GCP_SA_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ABTEC }}
