name: Check Firebase Functions

on:
  pull_request:
    branches:
      - main
    paths:
      - 'apps/firebase/functions/**'
      - 'apps/firebase/firebase.json'
      - 'apps/firebase/.firebaserc'
      - '.github/workflows/check-firebase-functions.yml'
      - '.github/workflows/deploy-firebase-functions.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'
          cache-dependency-path: apps/firebase/functions/package-lock.json

      - name: Install Firebase Functions dependencies
        run: npm ci
        working-directory: apps/firebase/functions

      - name: Build Firebase Functions
        run: npm run build
        working-directory: apps/firebase/functions

      - name: Verify build output
        run: |
          if [ -f "apps/firebase/functions/lib/index.js" ]; then
            echo "Functions build output found."
          else
            echo "ERROR: apps/firebase/functions/lib/index.js was not generated."
            find apps/firebase/functions -maxdepth 3 -type f | sort
            exit 1
          fi
