name: Deploy Firestore Rules

on:
  pull_request:
    types: [closed]
    branches:
      - master
    paths:
      - 'apps/firebase/firestore.rules'
      - 'apps/firebase/firebase.json'
      - 'apps/firebase/.firebaserc'
      - '.github/workflows/deploy-firestore-rules.yml'

jobs:
  deploy:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy Firestore Rules
        uses: w9jds/firebase-action@master
        with:
          args: deploy --only firestore:rules --project abtec-8f31e --config apps/firebase/firebase.json
        env:
          GCP_SA_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ABTEC }}
